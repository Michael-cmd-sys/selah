services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: selah
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: selah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selah -d selah"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
